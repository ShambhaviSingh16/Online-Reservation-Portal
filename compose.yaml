services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: trackease
      POSTGRES_USER: trackease
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - trackease-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U trackease -d trackease']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ['8080:8080']
    environment:
      DB_URL: jdbc:postgresql://db:5432/trackease
      DB_USER: trackease
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  trackease-data:
