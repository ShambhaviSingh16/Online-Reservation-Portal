spring.application.name=TrackEase
logging.level.org.springframework.web=INFO
spring.profiles.default=dev
spring.config.import=optional:file:./local.properties
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:${db.url:}}
spring.datasource.username=${DB_USER:${db.user:}}
spring.datasource.password=${DB_PASSWORD:${db.password:}}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
spring.jackson.time-zone=Asia/Kolkata
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Optional asynchronous email delivery must not mark reservation HTTP health down.
management.health.mail.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:}
app.mail.provider=${MAIL_PROVIDER:none}
app.mail.brevo-api-key=${BREVO_API_KEY:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
