spring.application.name=TrackEase
logging.level.org.springframework.web=INFO
spring.profiles.default=dev
spring.config.import=optional:file:./local.properties
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:${db.url:}}
spring.datasource.username=${DB_USER:${db.user:}}
spring.datasource.password=${DB_PASSWORD:${db.password:}}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
spring.jackson.time-zone=Asia/Kolkata
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
